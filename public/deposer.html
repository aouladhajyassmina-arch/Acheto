<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acheto — Déposer une annonce</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body data-page="deposer">
<div id="bar"></div>
<header class="top"><div class="brand" data-go="home"><img src="logo.jpeg" alt="">Ache<i>to</i></div>
<nav id="nav"><button data-go="home">Accueil</button><button data-go="new">Nouveautés</button><button data-go="search">Recherche</button><button data-go="msg">Messages</button><button data-go="prof">Profils</button></nav>
<a class="btn gh" id="auth" href="#" onclick="return openAuth('login',event)">Connexion</a><button class="btn pri" data-go="dep">+ Déposer</button></header>
<main>
<section class="view" id="v-dep"><h2>Déposer une annonce</h2><div class="steps"><span class="on">1 · Formulaire</span><span>2 · Vérification</span></div><form class="form" id="df"><label>Titre<input name="titre" required minlength="3" placeholder="Ex : Manteau cuir marron"></label>
<div class="r2"><label>Catégorie<select name="categorie"><option value="mode">Mode</option><option value="tech">Tech</option><option value="auto">Auto</option><option value="immo">Immo</option><option value="maison">Maison</option></select></label><label>Prix (DH)<input name="prix" type="number" min="0" required></label></div>
<div class="r2"><label>Ville<input name="ville" required></label><label>Téléphone<input name="tel" required placeholder="06 12 34 56 78"></label></div>
<label>Description<textarea name="description" rows="3"></textarea></label><label>Photo<input name="photo" type="file" accept="image/*"></label><button class="btn pri">Vérifier mon annonce ›</button></form></section>
<section class="view" id="v-ver"></section>
</main>
<nav class="tab" id="tab"><button data-go="home">🏠</button><button data-go="new">✨</button><button data-go="search">🔍</button><button data-go="msg">💬</button><button data-go="prof">👤</button></nav>
<div id="au"><div class="ac" id="ac"><div class="lgo"><i>A</i>cheto</div><p class="sub">Le bon choix à chaque fois.</p>
<div class="at"><button type="button" data-t="login" class="on">Connexion</button><button type="button" data-t="reg">Inscription</button></div>
<form id="af"><label class="nm">Nom complet<input name="nom" autocomplete="name"></label><label>Email<input name="email" required autocomplete="username"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label><div class="er" id="ae"></div><button class="go2" id="ag">Se connecter</button></form>
<button type="button" class="bk" id="abk">← Retour au site</button></div></div>
<div id="toast"></div>
<script src="app.js"></script></body></html>
